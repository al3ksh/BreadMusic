server:
  port: 2333

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true
  server:
    password: "${LAVALINK_PASSWORD}"
    bufferDurationMs: 400
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
    playerUpdateInterval: 5
    youtubeSearchEnabled: true

spring:
  main:
    allow-bean-definition-overriding: true

plugins:
  youtube:
    enabled: true
    allowSearch: true
    clients:
      - MUSIC
      - TV
      - TVHTML5_SIMPLY
      - MWEB
      - WEB
      - ANDROID_VR
      - WEBEMBEDDED
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "BreadMusic"
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytsearch:%QUERY%"
    sources:
      spotify: true
      applemusic: false
      deezer: false
      yandexmusic: false
      flowerytts: false
      youtube: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "PL"
      playlistLoadLimit: 6
      albumLoadLimit: 6
      localFiles: false
