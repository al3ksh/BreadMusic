name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DISCORD_TOKEN: ci-placeholder
      DISCORD_CLIENT_ID: ci-placeholder
      DISCORD_CLIENT_SECRET: ci-placeholder
      DISCORD_GUILD_ID: ci-placeholder
      LAVALINK_PASSWORD: ci-placeholder
      SESSION_SECRET: ci-placeholder-session-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install API dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Run tests
        run: npm test

      - name: Test landing demo boundaries and bot contract
        run: |
          npm run test:landing --prefix web
          node web/preview/bot-contract.cjs --check

      - name: Typecheck web
        run: npm run typecheck --prefix web

      - name: Build web
        run: npm run build --prefix web

      - name: Install browser for web smoke tests
        run: npx --prefix web playwright install --with-deps chromium

      - name: Test dashboard, Activity and released landing
        run: npm run test:e2e --prefix web

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high --json > audit-api.json || true
          npm audit --prefix web --omit=dev --audit-level=high --json > audit-web.json || true

      - name: Upload dependency audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audits
          path: |
            audit-api.json
            audit-web.json
