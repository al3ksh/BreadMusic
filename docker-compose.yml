services:
  lavalink:
    build:
      context: ./lavalink
      dockerfile: Dockerfile
    container_name: breadmusic-lavalink
    restart: always
    ports:
      - "2333:2333"
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - ./lavalink/plugins:/opt/Lavalink/plugins
    environment:
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    networks:
      - breadmusic-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider --header=\"Authorization: $${LAVALINK_PASSWORD:-youshallnotpass}\" http://localhost:2333/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    container_name: breadmusic-bot
    restart: always
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - LAVALINK_SECURE=false
      - DEFAULT_SOURCE=${DEFAULT_SOURCE:-ytsearch}
      - IDLE_TIMEOUT_MS=${IDLE_TIMEOUT_MS:-300000}
      - WEB_PORT=3001
      - WEB_HOST=0.0.0.0
      - WEB_URL=${WEB_URL:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET}
      - AUTOPLAY_LOG_LEVEL=${AUTOPLAY_LOG_LEVEL:-warn}
      - GUILD_ACCESS_MODE=${GUILD_ACCESS_MODE:-public}
      - ALLOWED_GUILD_IDS=${ALLOWED_GUILD_IDS:-}
      - PRIVATE_ACCESS_CONTACT=${PRIVATE_ACCESS_CONTACT:-aleksh8}
      - ACTIVITY_ENABLED=${ACTIVITY_ENABLED:-true}
      - PLAYER_EMOJI_IDS=${PLAYER_EMOJI_IDS:-}
      - NODE_ENV=production
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    networks:
      - breadmusic-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: breadmusic-web
    restart: always
    depends_on:
      - bot
    environment:
      - NEXT_PUBLIC_API_URL=http://bot:3001
      - NODE_ENV=production
    ports:
      - "3000:3000"
    networks:
      - breadmusic-network

networks:
  breadmusic-network:
    driver: bridge
