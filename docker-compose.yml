services:
  lavalink:
    build:
      context: ./lavalink
      dockerfile: Dockerfile
    container_name: breadmusic-lavalink
    restart: always
    init: true
    deploy:
      resources:
        limits:
          memory: ${LAVALINK_MEMORY_LIMIT:-1536m}
          cpus: ${LAVALINK_CPU_LIMIT:-2.0}
          pids: 256
        reservations:
          memory: ${LAVALINK_MEMORY_RESERVATION:-512m}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - ./lavalink/plugins:/opt/Lavalink/plugins
    environment:
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:?LAVALINK_PASSWORD must be set}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID:-}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET:-}
    networks:
      - breadmusic-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider --header=\"Authorization: $${LAVALINK_PASSWORD}\" http://localhost:2333/version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: bot
    container_name: breadmusic-bot
    restart: always
    init: true
    deploy:
      resources:
        limits:
          memory: ${BOT_MEMORY_LIMIT:-768m}
          cpus: ${BOT_CPU_LIMIT:-1.5}
          pids: 256
        reservations:
          memory: ${BOT_MEMORY_RESERVATION:-256m}
    depends_on:
      lavalink:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_GUILD_ID=${DISCORD_GUILD_ID}
      - LAVALINK_HOST=lavalink
      - LAVALINK_PORT=2333
      - LAVALINK_PASSWORD=${LAVALINK_PASSWORD:?LAVALINK_PASSWORD must be set}
      - LAVALINK_SECURE=false
      - DEFAULT_SOURCE=${DEFAULT_SOURCE:-ytsearch}
      - IDLE_TIMEOUT_MS=${IDLE_TIMEOUT_MS:-300000}
      - UPLOAD_STORAGE_LIMIT_MB=${UPLOAD_STORAGE_LIMIT_MB:-1024}
      - ARCADE_ANIMATION_WORKERS=${ARCADE_ANIMATION_WORKERS:-2}
      - WEB_PORT=3001
      - WEB_HOST=0.0.0.0
      - WEB_URL=${WEB_URL:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET}
      - UPLOAD_SIGNING_SECRET=${UPLOAD_SIGNING_SECRET:-}
      - AUTOPLAY_LOG_LEVEL=${AUTOPLAY_LOG_LEVEL:-warn}
      - GEMINI_AUTOPLAY_ENABLED=${GEMINI_AUTOPLAY_ENABLED:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_AUTOPLAY_MODEL=${GEMINI_AUTOPLAY_MODEL:-gemini-3.5-flash-lite}
      - GEMINI_AUTOPLAY_TIMEOUT_MS=${GEMINI_AUTOPLAY_TIMEOUT_MS:-6000}
      - GEMINI_AUTOPLAY_MAX_CANDIDATES=${GEMINI_AUTOPLAY_MAX_CANDIDATES:-24}
      - GUILD_ACCESS_MODE=${GUILD_ACCESS_MODE:-public}
      - ALLOWED_GUILD_IDS=${ALLOWED_GUILD_IDS:-}
      - PRIVATE_ACCESS_CONTACT=${PRIVATE_ACCESS_CONTACT:-aleksh8}
      - ALERTS_ENABLED=${ALERTS_ENABLED:-true}
      - DISCORD_ALERT_DM_USER_ID=${DISCORD_ALERT_DM_USER_ID:-}
      - ALERT_DISK_MIN_MB=${ALERT_DISK_MIN_MB:-512}
      - ALERT_RSS_MAX_MB=${ALERT_RSS_MAX_MB:-650}
      - ACTIVITY_ENABLED=${ACTIVITY_ENABLED:-true}
      - PLAYER_EMOJI_IDS=${PLAYER_EMOJI_IDS:-}
      - NODE_ENV=production
    volumes:
      - ./data:/app/data
    networks:
      - breadmusic-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/api/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    container_name: breadmusic-web
    restart: always
    init: true
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-512m}
          cpus: ${WEB_CPU_LIMIT:-1.0}
          pids: 256
        reservations:
          memory: ${WEB_MEMORY_RESERVATION:-128m}
    depends_on:
      bot:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://bot:3001
      - WEB_URL=${WEB_URL:-http://localhost:3000}
      - LANDING_DEMO_SEARCH_URL=${LANDING_DEMO_SEARCH_URL:-}
      - LANDING_DEMO_TOKEN=${LANDING_DEMO_TOKEN:-}
      - LANDING_DEMO_LYRICS_ENABLED=${LANDING_DEMO_LYRICS_ENABLED:-false}
      - LANDING_DEMO_CLIENT_IP_HEADER=${LANDING_DEMO_CLIENT_IP_HEADER:-}
      - NODE_ENV=production
    ports:
      - "${HOST_WEB_PORT:-3002}:3000"
    networks:
      - breadmusic-network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  breadmusic-network:
    driver: bridge
